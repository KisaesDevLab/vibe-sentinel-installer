# modules/print/compose.yml — Vibe Print (Phase 8P).
#
# RETARGETED 2026-08-28 onto the image the Vibe-Printer repo actually
# publishes. This module previously referenced three images —
# `vibe-print`, `vibe-print-release` and `vibe-print-scanner-inbox` —
# that no repository builds. Nothing would have started. The real product is
# `ghcr.io/kisaesdevlab/vibe-printer` (KisaesDevLab/Vibe-Printer, v0.1.0), one
# container, and it is also what the Vibe Appliance installs, so a firm running
# both now runs one packaging of one product.
#
# WHAT THE REAL PRODUCT IS, AND HOW IT DIFFERS FROM THIS MODULE'S ORIGINAL
# DESIGN. Read this before changing anything here.
#
# It is an API print gateway, not a print server. A caller POSTs a payload and
# a printer id to /v1/print over HTTP on :8080, and the gateway renders it and
# DIALS OUT to the device — ESC/POS and ZPL and Star on tcp/9100, IPP on
# tcp/631, or an office printer through the CUPS instance inside the container.
# 631 and 9100 are OUTBOUND destination ports. It does not listen on them.
#
# Two things the original module assumed do not exist yet:
#
#   1. IPP Everywhere queue publishing. Workstations cannot see virtual queues
#      over the mesh, because nothing publishes any. Callers integrate with the
#      HTTP API instead.
#   2. The scanner inbox (SMB / FTPS / SMTP receivers). Scan-to-folder from an
#      MFP has nowhere to land here, so SENT-PR-009's scan-destination control
#      has no enforcement point.
#
# Both are tracked as features of KisaesDevLab/Vibe-Printer.
#
# A third — held release with PIN/web release at the device — is WITHDRAWN, not
# pending. Decision 26 was removed from the build plan (v1.7, §11 R26) rather
# than left as a claim nothing could enforce: every job prints on submission,
# and the control plane's rules, schema and reports no longer describe holding.
#
# What this module delivers is a single controlled egress to every printer with
# a hash-chained audit of every job. The firm's scorecard must not claim more.
#
# CONSEQUENTLY the §2.6 host port map for this module collapses from eight
# entries (631, 9100, 8632, 445, 21, 2525, 30000-30009) to one. That is a
# reduction in exposed surface, not a regression.
#
# Storage: SQLite inside the print-data volume. This module no longer uses the
# shared Postgres and no longer needs the `vibe_print` database — the real
# product is single-process SQLite by design (its STATUS.md rules out the
# multi-node architecture Postgres would imply).
#
# NO CONTENT INSPECTION (Decision 24) still holds, and now holds structurally
# rather than by configuration: the gateway is handed a payload by a caller and
# renders it. There is no print stream to intercept and no CONTENT_INSPECTION
# switch on the image, so the healthcheck asserts the property differently —
# see modules/print/healthcheck.sh.

name: vibe-sentinel

networks:
  sentinel:
    name: vibe-sentinel

volumes:
  print-data:

services:
  vibe-printer:
    image: ${IMG_VIBE_PRINTER}
    restart: unless-stopped
    hostname: print
    environment:
      # Every setting this image reads is prefixed VIBE_PRINT_ and everything
      # else in the environment is ignored, so the shared .env passing through
      # is harmless.
      #
      # The ONLY credential. It gates the admin UI at /admin and every /v1
      # call; there is no user model behind it and the service refuses to boot
      # when it is empty. Generated once by lib/secrets.sh and preserved.
      VIBE_PRINT_SECRET: ${VIBE_PRINT_SECRET}
      VIBE_PRINT_DATA_DIR: /data
      VIBE_PRINT_TIMEZONE: ${TZ}
      # Nothing is in front of this container: it is published straight onto
      # the mesh interface. Trusting a forwarded-for header from anywhere would
      # let a caller forge the IP that the rate limiter and the tamper-evident
      # audit log both key off, so the list stays empty and is stated here
      # rather than left to the default.
      VIBE_PRINT_TRUSTED_PROXIES: "[]"
      # Print payloads are client documents. Keep a content hash once a job has
      # printed, not the payload.
      VIBE_PRINT_STORE_PAYLOADS: "false"
      VIBE_PRINT_AUDIT_RETENTION_DAYS: ${PRINT_AUDIT_RETENTION_DAYS:-365}
      VIBE_PRINT_JOB_RETENTION_DAYS: ${PRINT_JOB_RETENTION_DAYS:-30}
      # Surfaced in /v1/version so SENT-V-SENT-001 can see image drift.
      VIBE_PRINT_IMAGE_DIGEST: ${IMG_VIBE_PRINTER}
    volumes:
      - print-data:/data
    ports:
      # Plain HTTP on the mesh interface only. The traffic is inside WireGuard,
      # which is the same trade ntfy (8085) already makes. 8632 is the port
      # §2.6 had reserved for the print UI; it is now the whole surface.
      - "${MESH_BIND_IP}:8632:8080"
    networks: [sentinel]
    # A job that is mid-send to a printer must not be cut off - the gateway
    # marks such a job `uncertain` rather than reprinting a financial receipt.
    stop_grace_period: 30s
    # USB printers need the device passed through, which only makes sense on
    # bare metal. A device mapping for a path that does not exist stops the
    # container from starting at all, so this stays commented and is a
    # deliberate, copy-paste change.
    # devices:
    #   - "/dev/bus/usb:/dev/bus/usb"
    healthcheck:
      # /readyz is 200 only when the SQLite handle and the delivery worker are
      # both up. python3 is the image's base; curl is present but not depended
      # on here.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/readyz',timeout=4).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 45s
